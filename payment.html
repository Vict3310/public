<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Activation Required</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-bg-primary via-bg-secondary to-bg-primary p-4">
    
    <div class="auth-card text-center max-w-md w-full">
        <div class="auth-header">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-warning rounded-2xl mb-4 shadow-glow">
                <span class="text-2xl">🔒</span>
            </div>
            <h2 class="auth-title">Activation Required</h2>
            <p class="auth-description">Your account is currently pending activation.</p>
        </div>

        <div class="bg-glass p-4 rounded-lg mb-6 border border-white/10">
            <p class="text-white mb-2">To access the Inventory Dashboard, a one-time activation fee is required.</p>
            <h3 class="text-2xl font-bold text-accent">₦50,000</h3>
        </div>

        <div class="flex flex-col gap-3">
            <button id="payBtn" class="btn btn-success w-full py-3 text-lg">
                <span>💳</span> Pay Now to Activate
            </button>
            
            <button id="logoutBtn" class="btn btn-ghost w-full">
                Log Out
            </button>
        </div>

        <div class="mt-6 text-sm text-secondary">
            <p>Already paid? <a href="#" onclick="location.reload()" class="text-accent">Refresh Page</a></p>
            <p class="mt-2">Contact Support: <span class="text-white">0800-000-0000</span></p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>
    
    <!-- Paystack Inline Script -->
    <script src="https://js.paystack.co/v1/inline.js"></script>

    <script>
        // Payment Logic
        const payBtn = document.getElementById('payBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        let currentUser = null;

        // Logout Handler
        logoutBtn.addEventListener('click', () => {
            auth.signOut().then(() => window.location.href = 'index.html');
        });

        // Check Status on Load
        auth.onAuthStateChanged(async user => {
            if (user) {
                currentUser = user;
                const doc = await db.collection('users').doc(user.uid).get();
                const data = doc.data();
                if (data && data.accountStatus === 'active') {
                    window.location.href = 'dashboard.html';
                }
            } else {
                window.location.href = 'index.html';
            }
        });

        // Paystack Payment Handler
        payBtn.addEventListener('click', () => {
            console.log("Pay button clicked");
            
            if (!currentUser) {
                alert("User session not ready. Please refresh the page.");
                return;
            }

            if (typeof PaystackPop === 'undefined') {
                alert("Payment system not loaded. Please check your internet connection.");
                return;
            }

            const handler = PaystackPop.setup({
                key: 'pk_test_dd1c327861c71d8d46ffaef6e36e54099451586a', // Live Key: pk_live_04ad4f604013cce364d6b5984ac797dd4073cf4c
                email: currentUser.email,
                amount: 50000 * 100, // Amount in kobo
                currency: 'NGN',
                ref: '' + Math.floor((Math.random() * 1000000000) + 1),
                onClose: function() {
                    alert('Window closed.');
                },
                callback: function(response) {
                    // Payment Successful
                    payBtn.innerHTML = 'Activating...';
                    
                    // Update Firestore (Note: In production, do this via Webhook/Cloud Function for security)
                    db.collection('users').doc(currentUser.uid).update({
                        accountStatus: 'active',
                        paymentRef: response.reference,
                        activatedAt: new Date()
                    }).then(() => {
                        window.location.href = 'dashboard.html';
                    }).catch((error) => {
                        alert('Error activating account: ' + error.message);
                    });
                }
            });
            handler.openIframe();
        });
    </script>
</body>
</html>
