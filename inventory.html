<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Inventory & Sales</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <nav class="sidebar">
        <h2>Inventory App</h2>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="inventory.html" class="active">Inventory</a></li>
            <li><a href="sales.html">Sales</a></li>
        </ul>
        <button id="logoutBtn">Logout</button>
    </nav>
    <main class="main-content">
        <div class="inventory-header">
            <h1>Product Inventory</h1>
            <div class="header-actions">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search products...">
                    <div class="search-icon">🔍</div>
                </div>
                <input type="file" id="csvInput" accept=".csv" style="display: none;">
                <button id="importBtn" class="btn-secondary" style="margin-right: 10px;">
                    📂 Import CSV
                </button>
                <button id="addProductBtn" class="add-product-btn">
                    <span>+</span> Add Product
                </button>
            </div>
        </div>

        <div class="inventory-stats">
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-info">
                    <h3 id="totalProducts">0</h3>
                    <p>Total Products</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-info">
                    <h3 id="totalValue">₦0</h3>
                    <p>Total Value</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📈</div>
                <div class="stat-info">
                    <h3 id="lowStock">0</h3>
                    <p>Low Stock</p>
                </div>
            </div>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Products will be dynamically inserted here -->
        </div>

        <!-- Product Form Modal -->
        <div id="productModal" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Add New Product</h2>
                    <button type="button" class="modal-close" id="modalClose">&times;</button>
                </div>
                <form id="productFormElement" class="product-form">
                    <input type="hidden" id="editProductId">
                    <div class="form-group" style="text-align: center;">
                        <img id="imagePreview" src="" style="max-width: 100px; max-height: 100px; display: none; margin: 0 auto 10px; border-radius: 8px;">
                        <input type="file" id="productImage" accept="image/*" style="color: var(--text-secondary);">
                    </div>
                    <div class="form-group">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" placeholder="Enter product name" required>
                    </div>
                    <div class="form-group">
                        <label for="brand">Brand</label>
                        <input type="text" id="brand" placeholder="Enter brand name" required>
                    </div>
                    <div class="form-group">
                        <label for="barcode">Barcode (Optional)</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="barcode" placeholder="Scan or enter barcode">
                            <button type="button" id="scanBarcodeBtn" class="btn-secondary" style="padding: 10px;">📷</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Provisions">Provisions</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Health">Health & Beauty</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="storage">Storage (Optional)</label>
                        <input type="text" id="storage" placeholder="e.g., 128GB, 1L, Large">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="costPrice">Cost Price (₦)</label>
                            <input type="number" id="costPrice" placeholder="0.00" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="sellingPrice">Selling Price (₦)</label>
                            <input type="number" id="sellingPrice" placeholder="0.00" step="0.01" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <input type="number" id="quantity" placeholder="Enter quantity" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="supplierName">Supplier Name</label>
                            <input type="text" id="supplierName" placeholder="Supplier Name">
                        </div>
                        <div class="form-group">
                            <label for="supplierPhone">Supplier Phone</label>
                            <input type="tel" id="supplierPhone" placeholder="Supplier Phone">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Save Product</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Scanner Modal -->
        <div id="scannerModal" class="modal-overlay hidden">
            <div class="modal-content" style="max-width: 400px;">
                <div class="modal-header">
                    <h2>Scan Barcode</h2>
                    <button type="button" class="modal-close" id="closeScannerModal">&times;</button>
                </div>
                <div id="reader" style="width: 100%;"></div>
            </div>
        </div>
    </main>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="firebase.js"></script>
    <script src="auth.js"></script>
    <script src="inventory.js"></script>
</body>
</html>
