<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    <title>Inventory - Inventory & Sales</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="clean-modern.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <span>Inventory Pro</span>
                </div>
            </div>
            
            <div class="nav-menu">
                <ul>
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">
                            <i class="fas fa-chart-line nav-icon"></i>
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="inventory.html" class="nav-link active">
                            <i class="fas fa-boxes nav-icon"></i>
                            Inventory
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="sales.html" class="nav-link">
                            <i class="fas fa-cash-register nav-icon"></i>
                            Sales
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="customers.html" class="nav-link">
                            <i class="fas fa-users nav-icon"></i>
                            Customers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="analytics.html" class="nav-link">
                            <i class="fas fa-chart-bar nav-icon"></i>
                            Analytics
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="receipt.html" class="nav-link">
                            <i class="fas fa-receipt nav-icon"></i>
                            Receipt
                        </a>
                    </li>
                </ul>
            </div>
            
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn btn-secondary" style="width: 100%;">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </div>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">Product Inventory</h1>
                <div class="header-actions">
                    <div class="search-container">
                        <input type="text" id="searchInput" class="form-input search-input" placeholder="Search products...">
                        <div class="search-icon">
                            <i class="fas fa-search"></i>
                        </div>
                    </div>
                    <input type="file" id="csvInput" accept=".csv" style="display: none;">
                    <button id="importBtn" class="btn btn-secondary">
                        <i class="fas fa-file-import"></i>
                        Import CSV
                    </button>
                    <button id="addProductBtn" class="btn btn-primary">
                        <i class="fas fa-plus"></i>
                        Add Product
                    </button>
                    <button id="exportDataBtn" class="btn btn-secondary">
                        <i class="fas fa-download"></i>
                        Export Data
                    </button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-title">Total Products</div>
                        <div class="stat-icon" style="background: rgba(59, 130, 246, 0.1); color: var(--primary);">
                            <i class="fas fa-boxes"></i>
                        </div>
                    </div>
                    <div class="stat-value" id="totalProducts">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-title">Total Value</div>
                        <div class="stat-icon" style="background: rgba(16, 185, 129, 0.1); color: var(--success);">
                            <i class="fas fa-dollar-sign"></i>
                        </div>
                    </div>
                    <div class="stat-value" id="totalValue">₦0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-title">Low Stock</div>
                        <div class="stat-icon" style="background: rgba(245, 158, 11, 0.1); color: var(--warning);">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                    </div>
                    <div class="stat-value" id="lowStock">0</div>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="products-grid" id="productsGrid">
                <!-- Products will be loaded here -->
            </div>
        </main>
    </div>

    <!-- Product Modal -->
    <div id="productModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add New Product</h2>
                <button type="button" class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="editProductId">
                    
                    <div class="form-group text-center">
                        <label for="productImage" class="form-label">Product Image</label>
                        <img id="imagePreview" class="image-preview">
                        <input type="file" id="productImage" accept="image/*" class="form-input">
                    </div>
                    
                    <div class="form-group">
                        <label for="productName" class="form-label">Product Name</label>
                        <input type="text" id="productName" class="form-input" placeholder="Enter product name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="brand" class="form-label">Brand</label>
                        <input type="text" id="brand" class="form-input" placeholder="Enter brand name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="barcode" class="form-label">Barcode (Optional)</label>
                        <div class="flex gap-2">
                            <input type="text" id="barcode" class="form-input" placeholder="Scan or enter barcode">
                            <button type="button" id="scanBarcodeBtn" class="btn btn-secondary">
                                <i class="fas fa-camera"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="category" class="form-label">Category</label>
                        <select id="category" class="form-input" required>
                            <option value="">Select Category</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Provisions">Provisions</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Health">Health & Beauty</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="costPrice" class="form-label">Cost Price (₦)</label>
                        <input type="number" id="costPrice" class="form-input" placeholder="0.00" step="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="sellingPrice" class="form-label">Selling Price (₦)</label>
                        <input type="number" id="sellingPrice" class="form-input" placeholder="0.00" step="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="quantity" class="form-label">Quantity</label>
                        <input type="number" id="quantity" class="form-input" placeholder="0" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="minStock" class="form-label">Minimum Stock Level</label>
                        <input type="number" id="minStock" class="form-input" placeholder="5" min="0" value="5">
                    </div>
                    
                    <div class="form-group">
                        <label for="description" class="form-label">Description (Optional)</label>
                        <textarea id="description" class="form-input" rows="3" placeholder="Product description..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelBtn" class="btn btn-secondary">
                    <i class="fas fa-times"></i>
                    Cancel
                </button>
                <button type="submit" form="productForm" class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    <span id="submitBtnText">Save Product</span>
                </button>
            </div>
        </div>
    </div>

    <script src="firebase.js"></script>
    <script src="simple-notifications.js"></script>
    <script src="simple-nav.js"></script>
    <script src="auth.js"></script>
    <script src="inventory.js"></script>
    <script src="test-system.js"></script>
</body>
</html>
