<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Inventory Matrix</title>
    <link rel="stylesheet" href="futuristic.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <!-- Neural Sidebar -->
    <nav class="sidebar-2030">
        <div style="padding: var(--space-8) var(--space-6);">
            <div style="display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-8);">
                <div style="width: 50px; height: 50px; background: var(--bg-neural); border: 2px solid var(--primary); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; animation: quantumSpin 10s linear infinite;">
                    <span style="font-size: 1.5rem;">🧠</span>
                </div>
                <div>
                    <div class="text-gradient" style="font-size: 1.25rem; font-weight: 700;">Neural Matrix</div>
                    <div style="font-size: 0.75rem; color: var(--text-secondary);">Inventory System</div>
                </div>
            </div>
        </div>
        
        <div style="padding: 0 var(--space-4);">
            <div class="nav-item-2030">
                <a href="neural-dashboard.html" class="nav-link-2030">
                    <span style="font-size: 1.25rem;">📊</span>
                    <span>Neural Dashboard</span>
                </a>
            </div>
            <div class="nav-item-2030">
                <a href="neural-inventory.html" class="nav-link-2030 active">
                    <span style="font-size: 1.25rem;">📦</span>
                    <span>Inventory Matrix</span>
                </a>
            </div>
            <div class="nav-item-2030">
                <a href="neural-sales.html" class="nav-link-2030">
                    <span style="font-size: 1.25rem;">⚡</span>
                    <span>Sales Terminal</span>
                </a>
            </div>
            <div class="nav-item-2030">
                <a href="analytics.html" class="nav-link-2030">
                    <span style="font-size: 1.25rem;">🔮</span>
                    <span>Quantum Analytics</span>
                </a>
            </div>
        </div>
        
        <div style="margin-top: auto; padding: var(--space-6);">
            <button id="logoutBtn" class="btn-holo" style="width: 100%; font-size: 0.875rem;">
                <span>🚀</span>
                Disconnect
            </button>
        </div>
    </nav>
    
    <!-- Main Neural Interface -->
    <main class="main-content-2030">
        <div class="page-header-2030">
            <h1 class="page-title-2030">Inventory Matrix</h1>
            <p class="page-subtitle-2030">Neural product management system</p>
        </div>

        <!-- Neural Controls -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-8); flex-wrap: wrap; gap: var(--space-4);">
            <div style="display: flex; align-items: center; gap: var(--space-4);">
                <div class="form-neural" style="width: 300px;">
                    <input type="text" id="searchInput" placeholder=" " style="background: var(--bg-glass); border: 1px solid var(--border-neural);">
                    <label for="searchInput">Search Neural Database</label>
                </div>
            </div>
            <div style="display: flex; gap: var(--space-3);">
                <input type="file" id="csvInput" accept=".csv" style="display: none;">
                <button id="importBtn" class="neural-card" style="padding: var(--space-3) var(--space-4); cursor: pointer; border: 1px solid var(--info);">
                    <span style="margin-right: var(--space-2);">📡</span>Import Data
                </button>
                <button id="addProductBtn" class="btn-holo">
                    <span style="margin-right: var(--space-2);">➕</span>Add Neural Node
                </button>
            </div>
        </div>

        <!-- Neural Metrics -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-6); margin-bottom: var(--space-8);">
            <div class="neural-card" style="text-align: center;">
                <div style="font-size: 2rem; margin-bottom: var(--space-2);">📦</div>
                <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary);" id="totalProducts">0</div>
                <div style="font-size: 0.875rem; color: var(--text-secondary); text-transform: uppercase;">Neural Nodes</div>
            </div>
            <div class="neural-card" style="text-align: center;">
                <div style="font-size: 2rem; margin-bottom: var(--space-2);">💎</div>
                <div style="font-size: 1.5rem; font-weight: 700; color: var(--success);" id="totalValue">₦0</div>
                <div style="font-size: 0.875rem; color: var(--text-secondary); text-transform: uppercase;">Matrix Value</div>
            </div>
            <div class="neural-card" style="text-align: center;">
                <div style="font-size: 2rem; margin-bottom: var(--space-2);">⚠️</div>
                <div style="font-size: 1.5rem; font-weight: 700; color: var(--warning);" id="lowStock">0</div>
                <div style="font-size: 0.875rem; color: var(--text-secondary); text-transform: uppercase;">Low Stock Alerts</div>
            </div>
        </div>

        <!-- Neural Product Grid -->
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-6);" id="productsGrid">
            <!-- Products will be populated here -->
        </div>

        <!-- Neural Product Modal -->
        <div id="productModal" class="hidden" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 10, 15, 0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(10px);">
            <div class="neural-card" style="width: 100%; max-width: 600px; margin: var(--space-4); max-height: 90vh; overflow-y: auto;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6);">
                    <h2 id="modalTitle" style="font-size: 1.5rem; font-weight: 600; color: var(--text-primary);">Add Neural Node</h2>
                    <button type="button" id="modalClose" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
                </div>
                
                <form id="productFormElement" style="display: flex; flex-direction: column; gap: var(--space-6);">
                    <input type="hidden" id="editProductId">
                    
                    <div style="text-align: center;">
                        <img id="imagePreview" src="" style="max-width: 120px; max-height: 120px; display: none; margin: 0 auto var(--space-4); border-radius: var(--radius); border: 2px solid var(--border-neural);">
                        <div class="form-neural">
                            <input type="file" id="productImage" accept="image/*" style="background: var(--bg-glass); border: 1px solid var(--border-neural);">
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
                        <div class="form-neural">
                            <input type="text" id="productName" placeholder=" " required>
                            <label for="productName">Product Name</label>
                        </div>
                        <div class="form-neural">
                            <input type="text" id="brand" placeholder=" " required>
                            <label for="brand">Brand</label>
                        </div>
                    </div>
                    
                    <div class="form-neural">
                        <div style="display: flex; gap: var(--space-2);">
                            <input type="text" id="barcode" placeholder=" " style="flex: 1;">
                            <button type="button" id="scanBarcodeBtn" class="btn-holo" style="padding: var(--space-3);">📷</button>
                        </div>
                        <label for="barcode">Neural Barcode</label>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
                        <div class="form-neural">
                            <select id="category" required style="background: var(--bg-glass); border: 1px solid var(--border-neural); color: var(--text-primary);">
                                <option value="">Select Category</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Provisions">Provisions</option>
                                <option value="Clothing">Clothing</option>
                                <option value="Health">Health & Beauty</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>
                        <div class="form-neural">
                            <input type="text" id="storage" placeholder=" ">
                            <label for="storage">Storage Specs</label>
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-4);">
                        <div class="form-neural">
                            <input type="number" id="costPrice" placeholder=" " step="0.01" required>
                            <label for="costPrice">Cost Price (₦)</label>
                        </div>
                        <div class="form-neural">
                            <input type="number" id="sellingPrice" placeholder=" " step="0.01" required>
                            <label for="sellingPrice">Selling Price (₦)</label>
                        </div>
                        <div class="form-neural">
                            <input type="number" id="quantity" placeholder=" " required>
                            <label for="quantity">Quantity</label>
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
                        <div class="form-neural">
                            <input type="text" id="supplierName" placeholder=" ">
                            <label for="supplierName">Supplier Name</label>
                        </div>
                        <div class="form-neural">
                            <input type="tel" id="supplierPhone" placeholder=" ">
                            <label for="supplierPhone">Supplier Contact</label>
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: var(--space-4); justify-content: flex-end;">
                        <button type="button" id="cancelBtn" class="neural-card" style="padding: var(--space-3) var(--space-6); cursor: pointer;">Cancel</button>
                        <button type="submit" class="btn-holo">Save Neural Node</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Neural Scanner Modal -->
        <div id="scannerModal" class="hidden" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 10, 15, 0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(10px);">
            <div class="neural-card" style="width: 100%; max-width: 400px; margin: var(--space-4);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4);">
                    <h2 style="font-size: 1.25rem; font-weight: 600; color: var(--text-primary);">Neural Scanner</h2>
                    <button type="button" id="closeScannerModal" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
                </div>
                <div id="reader" style="width: 100%; border-radius: var(--radius); overflow: hidden;"></div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="firebase.js"></script>
    <script src="auth.js"></script>
    <script src="neural-inventory.js"></script>
</body>
</html>
