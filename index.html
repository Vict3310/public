<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory & Sales - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-bg-primary via-bg-secondary to-bg-primary p-4">
    <!-- Background Pattern -->
    <div class="fixed inset-0 opacity-30">
        <div class="absolute inset-0 bg-gradient-to-r from-primary/10 via-secondary/10 to-accent/10"></div>
        <div class="absolute top-20 left-20 w-72 h-72 bg-primary/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-20 right-20 w-96 h-96 bg-secondary/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-accent/20 rounded-full blur-3xl"></div>
    </div>

    <div class="relative z-10 w-full max-w-md">
        <!-- Logo/Brand -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-primary rounded-2xl mb-4 shadow-glow">
                <span class="text-2xl">📦</span>
            </div>
            <h1 class="text-3xl font-bold text-primary mb-2">Welcome Back</h1>
            <p class="text-secondary">Sign in to your inventory dashboard</p>
        </div>

        <!-- Login Form -->
        <div class="auth-card">
            <div class="auth-header">
                <h2 class="auth-title">Sign In</h2>
                <p class="auth-description">Enter your credentials to access your account</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary w-full">
                    <span>🔓</span>
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                <p class="text-secondary">
                    Don't have an account?
                    <a href="#" id="showSignup" class="text-accent hover:text-accent-light transition-colors font-medium">
                        Create one
                    </a>
                </p>
            </div>
        </div>

        <!-- Signup Form -->
        <div class="auth-card hidden" id="signupForm">
            <div class="auth-header">
                <h2 class="auth-title">Create Account</h2>
                <p class="auth-description">Join us to manage your inventory efficiently</p>
            </div>

            <form id="signupFormElement" class="auth-form">
                <div class="form-group">
                    <label for="signupEmail" class="form-label">Email Address</label>
                    <input
                        type="email"
                        id="signupEmail"
                        class="form-input"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupPassword" class="form-label">Password</label>
                    <input
                        type="password"
                        id="signupPassword"
                        class="form-input"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-success w-full">
                    <span>✨</span>
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                <p class="text-secondary">
                    Already have an account?
                    <a href="#" id="showLogin" class="text-accent hover:text-accent-light transition-colors font-medium">
                        Sign in
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>
    <script src="auth.js"></script>
</body>
</html>
