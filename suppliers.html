<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppliers - Inventory & Sales</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <div class="sidebar-logo-icon">📦</div>
                <div class="sidebar-logo-text">Inventory</div>
            </div>
        </div>
        <div class="sidebar-nav">
            <ul class="sidebar-nav-list">
                <li><a href="dashboard.html" class="sidebar-nav-link"><span>📊</span>Dashboard</a></li>
                <li><a href="inventory.html" class="sidebar-nav-link"><span>📦</span>Inventory</a></li>
                <li><a href="sales.html" class="sidebar-nav-link"><span>💰</span>Sales</a></li>
                <li><a href="analytics.html" class="sidebar-nav-link"><span>📈</span>Analytics</a></li>
                <li><a href="suppliers.html" class="sidebar-nav-link active"><span>🏪</span>Suppliers</a></li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="sidebar-logout-btn"><span>😪</span>Logout</button>
        </div>
    </nav>
    
    <main class="main-content">
        <div class="inventory-header">
            <h1>Supplier Management</h1>
            <div class="header-actions">
                <div class="search-container">
                    <input type="text" id="searchSuppliers" class="form-input" placeholder="Search suppliers...">
                    <div class="search-icon">🔍</div>
                </div>
                <button id="addSupplierBtn" class="btn btn-primary">
                    <span>+</span> Add Supplier
                </button>
            </div>
        </div>

        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-6);" id="suppliersGrid">
            <!-- Suppliers will be populated here -->
        </div>

        <!-- Add Supplier Modal -->
        <div id="supplierModal" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="supplierModalTitle">Add New Supplier</h2>
                    <button type="button" class="modal-close" id="closeSupplierModal">&times;</button>
                </div>
                <div style="padding: var(--space-6);">
                    <form id="supplierForm">
                        <input type="hidden" id="editSupplierId">
                        <div class="form-group">
                            <label for="supplierName" class="form-label">Company Name</label>
                            <input type="text" id="supplierName" class="form-input" placeholder="Enter company name" required>
                        </div>
                        <div class="form-group">
                            <label for="contactPerson" class="form-label">Contact Person</label>
                            <input type="text" id="contactPerson" class="form-input" placeholder="Contact person name">
                        </div>
                        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--space-4);">
                            <div class="form-group">
                                <label for="supplierPhone" class="form-label">Phone</label>
                                <input type="tel" id="supplierPhone" class="form-input" placeholder="Phone number" required>
                            </div>
                            <div class="form-group">
                                <label for="supplierEmail" class="form-label">Email</label>
                                <input type="email" id="supplierEmail" class="form-input" placeholder="Email address">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="supplierAddress" class="form-label">Address</label>
                            <input type="text" id="supplierAddress" class="form-input" placeholder="Business address">
                        </div>
                        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--space-4);">
                            <div class="form-group">
                                <label for="supplierCategory" class="form-label">Category</label>
                                <select id="supplierCategory" class="form-input">
                                    <option value="Electronics">Electronics</option>
                                    <option value="Provisions">Provisions</option>
                                    <option value="Clothing">Clothing</option>
                                    <option value="Health">Health & Beauty</option>
                                    <option value="Others">Others</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="paymentTerms" class="form-label">Payment Terms</label>
                                <select id="paymentTerms" class="form-input">
                                    <option value="Cash">Cash on Delivery</option>
                                    <option value="7days">7 Days Credit</option>
                                    <option value="14days">14 Days Credit</option>
                                    <option value="30days">30 Days Credit</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex gap-3 justify-end">
                            <button type="button" class="btn btn-secondary" onclick="document.getElementById('supplierModal').classList.add('hidden')">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Supplier</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>
    <script src="auth.js"></script>
    <script src="suppliers.js"></script>
</body>
</html>
