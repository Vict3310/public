<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test</title>
</head>
<body>
    <h1>Firebase Connection Test</h1>
    <div id="status">Testing Firebase connection...</div>
    <button id="testBtn">Test Firebase</button>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBHKSldnC_Y7iMi8TYrYua6s6V-vtWSEl8",
            authDomain: "inventoryapp-dc025.firebaseapp.com",
            databaseURL: "https://inventoryapp-dc025-default-rtdb.firebaseio.com",
            projectId: "inventoryapp-dc025",
            storageBucket: "inventoryapp-dc025.firebasestorage.app",
            messagingSenderId: "818396573664",
            appId: "1:818396573664:web:39d45df51883a7ae450585",
            measurementId: "G-WKVRZTQCCW"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const statusDiv = document.getElementById('status');
        const testBtn = document.getElementById('testBtn');

        // Test Firebase connection
        testBtn.addEventListener('click', async () => {
            try {
                statusDiv.textContent = 'Testing Firebase Auth...';
                const user = auth.currentUser;
                statusDiv.textContent += ' Auth OK. ';

                statusDiv.textContent += 'Testing Firestore...';
                // Try to read from a test collection
                const testRef = db.collection('test');
                const snapshot = await testRef.limit(1).get();
                statusDiv.textContent += ' Firestore OK!';

                statusDiv.style.color = 'green';
                statusDiv.textContent += ' ✅ Firebase is working!';
            } catch (error) {
                statusDiv.style.color = 'red';
                statusDiv.textContent = '❌ Error: ' + error.message;
                console.error('Firebase test error:', error);
            }
        });

        // Auto test on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                testBtn.click();
            }, 1000);
        });
    </script>
</body>
</html>
